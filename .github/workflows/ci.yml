name: Build, test, and package Download It
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: download-it-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
jobs:
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate commit messages and PR title
        run: pnpm lint:commits:ci
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm build
      - run: pnpm --filter @dm/browser-extension build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf aria2
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install aria2 dylibbundler
      - name: Windows aria2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tooling/binaries/windows.ps1
      - name: Locate Unix aria2
        if: runner.os != 'Windows'
        run: echo "ARIA2_BIN=$(command -v aria2c)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:aria2
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - name: Real aria2 transfer tests
        run: node tests/rust/run-transfers.mjs
      - name: Compile desktop application
        run: pnpm --filter @dm/desktop tauri build --no-bundle
  release:
    needs: [commits, frontend, desktop]
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop
      - name: Windows aria2 and upstream notices
        shell: pwsh
        run: ./tooling/binaries/windows.ps1
      - run: pnpm install --frozen-lockfile
      - name: Commit release version, build installers, and publish
        run: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
