name: Validate Download It
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf aria2
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install aria2 dylibbundler
      - name: Windows aria2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $versions = Get-Content tooling/binaries/versions.json | ConvertFrom-Json
          Invoke-WebRequest $versions.aria2.windowsX64 -OutFile "$env:RUNNER_TEMP/aria2.zip"
          Expand-Archive "$env:RUNNER_TEMP/aria2.zip" "$env:RUNNER_TEMP/aria2"
          $binary = Get-ChildItem "$env:RUNNER_TEMP/aria2" -Recurse -Filter aria2c.exe | Select-Object -First 1
          "ARIA2_BIN=$($binary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Locate Unix aria2
        if: runner.os != 'Windows'
        run: echo "ARIA2_BIN=$(command -v aria2c)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:aria2
      - run: cargo test --locked
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked -p dm-aria2 --test transfers -- --ignored --test-threads=1
      - run: pnpm --filter @dm/desktop tauri build --no-bundle
